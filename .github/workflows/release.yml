name: Release extension

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tests/verify.py импортирует openpyxl на уровне модуля: без пакета
      # run-tests.mjs падает, а не пропускает проверку.
      - name: Install verifier dependency
        run: python -m pip install --quiet --disable-pip-version-check openpyxl

      - name: Tests
        run: node tests/run-tests.mjs

      - name: Build extension ZIP
        run: node scripts/build-extension.mjs --version "${{ github.ref_name }}" --out dist

      # Имена внутри SHA256SUMS без dist/: иначе sha256sum -c не найдёт файл,
      # если положить архив и контрольную сумму в одну папку.
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-pay-export-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
